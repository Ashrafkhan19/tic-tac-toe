name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: string
      version_code:
        description: 'Custom versionCode override (optional)'
        required: false
        type: string
      version_name:
        description: 'Custom versionName override (optional, e.g. 1.0.1)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version Code and Version Name
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION_NAME" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.0"
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_CODE=$(( RUN_NUMBER + 100 ))
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Target Version Name: $VERSION_NAME"
          echo "Target Version Code: $VERSION_CODE"

      - name: Decode Keystore
        env:
          PLAY_STORE_KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_STORE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret PLAY_STORE_KEYSTORE_BASE64 is missing or empty. Please configure repository secrets."
            exit 1
          fi
          echo "$PLAY_STORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Build Release App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:androidApp:bundleRelease "-PversionCode=$VERSION_CODE" "-PversionName=$VERSION_NAME"

      - name: Archive App Bundle and Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decode Service Account JSON
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing or empty. Please configure repository secrets."
            exit 1
          fi
          if echo "$PLAY_SERVICE_ACCOUNT_JSON" | grep -q '^[[:space:]]*{'; then
            echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service_account.json"
          else
            echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > "$RUNNER_TEMP/service_account.json"
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/service_account.json
          packageName: studio.gameloop.tictactoe
          releaseFiles: app/androidApp/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          mappingFile: ${{ hashFiles('app/androidApp/build/outputs/mapping/release/mapping.txt') != '' && 'app/androidApp/build/outputs/mapping/release/mapping.txt' || '' }}
          status: completed

